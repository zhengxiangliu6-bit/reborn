<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族重启日记</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene"></div>

<div id="app">
  <!-- 标题界面 -->
  <section id="screen-title" class="screen active">
    <div class="title-card">
      <h1 class="game-title">家族重启日记</h1>
      <div class="game-subtitle">- 一 年 一 页 · 一 代 一 生 -</div>
      <canvas id="title-char" width="96" height="120"></canvas>
      <p class="title-tip">一代一代，传承家族的荣光</p>
      <div id="title-legacy-summary" class="title-legacy-summary"></div>
      <div class="title-actions">
        <button id="btn-continue-game" class="pixel-btn gold hidden">继续当前家族</button>
        <button id="btn-start" class="pixel-btn">开启家族传奇</button>
        <button id="btn-legacy" class="pixel-btn secondary">🏛 家族传承馆</button>
      </div>
    </div>
  </section>

  <!-- 创建角色界面 -->
  <section id="screen-create" class="screen">
    <div class="panel create-card">
      <h2 class="panel-title">家族初代：开创新人生</h2>

      <div class="create-row">
        <label class="row-label">姓 名</label>
        <input id="input-name" class="pixel-input" maxlength="6" placeholder="给自己起个名字">
      </div>

      <div class="create-row">
        <label class="row-label">性 别</label>
        <div class="seg-btns">
          <button data-gender="male" class="seg-btn active">男 孩</button>
          <button data-gender="female" class="seg-btn">女 孩</button>
        </div>
      </div>

      <div class="create-row">
        <label class="row-label">出 身</label>
        <div id="bg-cards" class="bg-cards"></div>
      </div>

      <div class="create-row">
        <label class="row-label">家族愿望</label>
        <div id="aspiration-cards" class="aspiration-cards"></div>
      </div>

      <button id="btn-begin" class="pixel-btn big">开 启 人 生</button>
    </div>
  </section>

  <!-- 游戏主界面 -->
  <section id="screen-game" class="screen">
    <div class="game-topbar">
      <span id="g-gen" class="gen-badge">第1代</span>
      <span id="g-name">名字</span>
      <span class="dot">·</span>
      <span id="g-stage">阶段</span>
      <span class="dot">·</span>
      <span id="g-age">0</span>岁
      <span class="dot">·</span>
      <span id="g-money" class="money-badge">💰 0</span>
      <button id="btn-achievements" class="reputation-badge">🏅 0</button>
    </div>

    <div class="game-main">
      <div class="avatar-panel panel">
        <canvas id="avatar" width="96" height="120"></canvas>
        <div id="stage-name" class="stage-label"></div>
        <div id="age-band" class="age-band"></div>
        <div id="job-info" class="job-info"></div>
        <div id="aspiration-info" class="aspiration-info"></div>
        <div id="route-info" class="route-info"></div>
        <!-- 妻儿区 -->
        <div id="family-section" class="family-section"></div>
      </div>

      <div class="right-col">
        <div class="stats-panel panel">
          <div class="panel-title small">个人属性</div>
          <div id="stats-list"></div>
        </div>
        <!-- 家族资产 -->
        <div id="assets-panel" class="assets-panel panel">
          <div class="panel-title small">家族资产</div>
          <div id="assets-list"></div>
        </div>
      </div>
    </div>

    <!-- 18岁后解锁：年度结算/商城/活动 -->
    <div id="economy-row" class="economy-row hidden">
      <button id="btn-shop" class="eco-btn">🛒 商 城</button>
      <button id="btn-activity" class="eco-btn">🎉 活动</button>
      <button id="btn-marriage" class="eco-btn">💕 相亲/育儿</button>
      <button id="btn-family" class="eco-btn family-btn">🎯 年度玩法</button>
    </div>

    <div class="story-panel panel">
      <p id="story-text"></p>
      <div id="choices" class="choices"></div>
      <button id="btn-continue" class="continue-btn">休息一年 ▶</button>
    </div>
  </section>

  <!-- 商城/活动/育儿 弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-mask"></div>
    <div class="panel modal-card">
      <div class="modal-head">
        <div id="modal-title" class="panel-title"></div>
        <button id="modal-close" class="modal-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 继承选择界面 -->
  <section id="screen-inherit" class="screen">
    <div class="panel inherit-card">
      <div class="end-banner">传 承 之 光</div>
      <h2 class="life-title">选择继任者</h2>
      <p id="inherit-tip" class="inherit-tip"></p>
      <div id="inherit-children" class="inherit-list"></div>
      <div class="inherit-actions">
        <button id="btn-inherit-new" class="pixel-btn">重新开局（全新家族）</button>
      </div>
    </div>
  </section>

  <!-- 人生总结界面 -->
  <section id="screen-summary" class="screen">
    <div class="panel summary-card">
      <div class="end-banner" id="end-banner-text">人 生 终 章</div>
      <h2 id="life-title" class="life-title"></h2>
      <canvas id="summary-char" width="96" height="120"></canvas>
      <div id="final-stats" class="final-stats"></div>
      <div id="family-wealth" class="family-wealth-block"></div>
      <div class="summary-section">
        <div class="panel-title small">人生成就</div>
        <div id="achievements" class="achievements"></div>
      </div>
      <div class="summary-section">
        <div class="panel-title small">人生轨迹</div>
        <div id="life-log" class="life-log"></div>
      </div>
      <button id="btn-restart" class="pixel-btn big">重 启 人 生</button>
    </div>
  </section>
</div>

<script src="game.js"></script>
</body>
</html>
